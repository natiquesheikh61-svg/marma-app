<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Marma Translator · মারমা অনুবাদক</title>
  <meta name="description" content="Free Marma – Bangla – English translator and Marma learning app. Works offline.">
  <meta name="theme-color" content="#1fa36b">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply saved theme before the page paints (avoids a white flash in dark mode)
    (function () { try { var th = localStorage.getItem('theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {} })();
  </script>
  <style>
    /* Splash screen (shown while the app starts) */
    #splash { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: linear-gradient(160deg, #1fa36b 0%, #2fb5a8 55%, #2d9cdb 100%); color: #fff; transition: opacity .45s ease, visibility .45s; }
    #splash.hide { opacity: 0; visibility: hidden; }
    #splash svg { width: 150px; height: 150px; animation: sp-bounce 1.1s ease-in-out infinite; filter: drop-shadow(0 10px 18px rgba(0,0,0,.18)); }
    #splash h1 { margin: 18px 0 4px; font: 800 1.8rem system-ui, sans-serif; letter-spacing: .5px; animation: sp-up .6s .15s both; }
    #splash p { margin: 0; font: 500 1rem system-ui, sans-serif; opacity: .9; animation: sp-up .6s .3s both; }
    #splash .sp-dots { margin-top: 26px; display: flex; gap: 8px; }
    #splash .sp-dots i { width: 10px; height: 10px; border-radius: 50%; background: #fff; animation: sp-dot 1s infinite; }
    #splash .sp-dots i:nth-child(2) { animation-delay: .15s; } #splash .sp-dots i:nth-child(3) { animation-delay: .3s; }
    #splash small { position: absolute; bottom: 22px; font: 600 .85rem system-ui, sans-serif; opacity: .9; }
    @keyframes sp-bounce { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14px) scale(1.04); } }
    @keyframes sp-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes sp-dot { 0%,100% { opacity: .3; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.15); } }
    @media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="0 0 120 120">
      <circle cx="92" cy="26" r="13" fill="#ffc93c"/>
      <path d="M8 104 Q30 30 60 30 Q90 30 112 104 Z" fill="#fff" opacity=".95"/>
      <path d="M30 104 Q44 62 60 62 Q76 62 90 104 Z" fill="#d8f5e6"/>
      <circle cx="48" cy="62" r="9" fill="#1fa36b"/><circle cx="72" cy="62" r="9" fill="#1fa36b"/>
      <circle cx="50" cy="63" r="4" fill="#fff"/><circle cx="74" cy="63" r="4" fill="#fff"/>
      <path d="M50 80 Q60 90 70 80" stroke="#1fa36b" stroke-width="4" fill="none" stroke-linecap="round"/>
    </svg>
    <h1>মারমা · Marma</h1>
    <p>শিখুন · অনুবাদ করুন · কথা বলুন</p>
    <div class="sp-dots"><i></i><i></i><i></i></div>
    <small>Developed by Capt Natique, 81 BMA LC</small>
  </div>

  <header class="topbar">
    <button class="icon-btn" id="homeBtn" aria-label="Home">🏠</button>
    <h1 id="appTitle">মারমা অনুবাদক</h1>
    <button class="pill-btn" id="langBtn">English</button>
    <button class="icon-btn" id="themeBtn" aria-label="Dark mode">🌙</button>
  </header>

  <div id="offlineBar" class="offline-bar" hidden></div>

  <main id="app" tabindex="-1"></main>

  <footer class="footer">
    <div>Developed by Capt Natique, 81 BMA LC</div>
  </footer>

  <nav class="bnav" id="bnav" aria-label="Menu"></nav>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script src="learn.js"></script>
  <script>
    // Hide the splash screen once the app is ready (at least ~1 second so it can be seen)
    (function () {
      var t0 = Date.now(), el = document.getElementById('splash');
      var shown = false; try { shown = sessionStorage.getItem('splash') === '1'; sessionStorage.setItem('splash', '1'); } catch (e) {}
      function hide() { setTimeout(function () { el.classList.add('hide'); setTimeout(function () { el.remove(); }, 500); }, Math.max(0, (shown ? 300 : 1200) - (Date.now() - t0))); }
      if (document.readyState === 'complete') hide(); else window.addEventListener('load', hide);
    })();
  </script>
</body>
</html>
